name: Rust

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libglib2.0-dev \
            libcairo2-dev \
            pkg-config

      - name: Build
        run: cargo build --release --verbose

      - name: Prepare Debian package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/pixmaps

          cp target/release/tmtcopen package/usr/bin/tmtcopen
          chmod 755 package/usr/bin/tmtcopen

          cp resources/logo.png \
            package/usr/share/pixmaps/tmtcopen.png

          cp resources/tmtcopen.desktop \
            package/usr/share/applications/tmtcopen.desktop

          chmod 644 package/usr/share/pixmaps/tmtcopen.png
          chmod 644 package/usr/share/applications/tmtcopen.desktop

          cat > package/DEBIAN/control << EOF
          Package: tmtcopen
          Version: ${VERSION}
          Section: graphics
          Priority: optional
          Architecture: amd64
          Depends: maim, libgtk-3-0, libgdk-pixbuf-2.0-0, libglib2.0-0, libcairo2
          Maintainer: tmtco1
          Description: tmtcopen
           Screen drawing application.
           Designed for use with Pardus ETAP smart boards.
          EOF

          dpkg-deb --build \
            --root-owner-group \
            package \
            "tmtcopen_${VERSION}_amd64.deb"

      - name: Upload Debian package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tmtcopen_*_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
